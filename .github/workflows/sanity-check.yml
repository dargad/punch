name: Test All CLI Options

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-cli-options:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies with Poetry
        run: poetry install

      - name: Install Firefox and virtual display
        run: |
          poetry run playwright install --with-deps firefox
          sudo apt-get install -y xvfb xauth

      - name: Make scripts executable
        run: chmod +x scripts/test_all_cli_options.sh

      - name: Run CLI options test script
        run: PUNCH_TEST_BROWSER=1 xvfb-run -a poetry run scripts/test_all_cli_options.sh